<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LOKSHN Search</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LOKSHN Search">
<meta name="theme-color" content="#16324f">
<style>
:root{--bg:#eceff3;--card:#fff;--ink:#16202b;--mut:#5d6b79;--line:#d5dce4;--acc:#16324f;--ok:#1f7a4d;--okbg:#e0f2e8;--warn:#9a5200;--warnbg:#fdeccf;--na:#55606b;--nabg:#e6e9ed}
@media(prefers-color-scheme:dark){:root{--bg:#10151b;--card:#192029;--ink:#e8edf2;--mut:#93a1af;--line:#2a3541;--acc:#9cc2ee;--ok:#7fd3a3;--okbg:#17372a;--warn:#f1b266;--warnbg:#3d2a10;--na:#a3afbb;--nabg:#242d37}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:680px;margin:0 auto;padding:16px}
header{position:sticky;top:0;background:var(--bg);padding:12px 0 10px;z-index:2}
input{width:100%;font:inherit;font-size:20px;padding:14px 16px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
input:focus{outline:none;border-color:var(--acc)}
#status{display:flex;justify-content:space-between;gap:8px;color:var(--mut);font-size:13px;margin-top:8px;min-height:20px}
button{font:inherit;cursor:pointer}
#refresh{background:none;border:0;color:var(--acc);font-size:13px;padding:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 12px}
.word{font:600 34px/1.2 "Frank Ruhl Libre","David","Times New Roman",serif;direction:rtl;text-align:right;margin:0 0 8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
dl{display:grid;grid-template-columns:7.5rem 1fr;gap:6px 12px;margin:0}
dt{color:var(--mut);font-size:14px}
dd{margin:0;overflow-wrap:anywhere}
.empty{color:var(--mut)}
.badge{display:inline-block;padding:1px 10px;border-radius:99px;font-size:14px;font-weight:600}
.yes{background:var(--okbg);color:var(--ok)}.exc{background:var(--warnbg);color:var(--warn)}.na{background:var(--nabg);color:var(--na)}
.sound{color:var(--mut);font-style:italic}
#more{display:block;margin:4px auto 24px;padding:10px 20px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--acc)}
.msg{text-align:center;color:var(--mut);padding:32px 8px}
#tabs{display:flex;gap:6px;margin-top:10px}
#tabs button{flex:1;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--mut);font-weight:600}
#tabs button.on{background:var(--acc);color:var(--card);border-color:var(--acc)}
.tw{overflow-x:auto;margin:0 0 16px}
table{border-collapse:collapse;width:100%;background:var(--card)}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:start;vertical-align:top;white-space:pre-line}
th{background:var(--nabg)}
.note{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 10px;white-space:pre-line}
</style>
</head>
<body>
<main>
<header>
<input id="q" type="search" dir="auto" lang="yi" placeholder="Search a Yiddish word…" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
<div id="status"><span id="count"></span><button id="refresh" type="button">Refresh data</button></div>
<nav id="tabs"><button type="button" data-v="search" class="on">Search</button><button type="button" data-v="tables">Tables</button><button type="button" data-v="notes">Footnotes</button></nav>
</header>
<div id="results"></div>
<button id="more" type="button" hidden>Show more</button>
<div id="tables" hidden></div>
<div id="notes" hidden></div>
</main>
<script>
const SHEET_ID='1Vip_J4QjpMBorfov15jmbXouSXQMAmMXT0EbYsYfPkc',GID='671156978';
const CSV_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${GID}`;
const CACHE_KEY='vowel-lookup-v1',PAGE=50;
// Slides: read live through the Google Slides API (needs a free API key; see setup notes).
const SLIDES_ID='1OzduSlGXEnK3ZCFV1P83UKeNwms5MjKgagxxe6kpKZY',SLIDE_OBJ='h105c52efcca4e630_2_0',API_KEY='AIzaSyBMMwJh6YWmhz81zVHE7a4a4830cJiph1U';
// Columns are found by header name; letter positions (A,B,C,D,P,Q,R) are the fallback.
const COLS={word:[['word'],0],gloss:[['gloss'],1],comp:[['component'],2],pos:[['part of speech'],3],rule:[['associated rule'],15],follows:[['follows rule?','follows rule'],16],notes:[['notes'],17]};
const DB_NAME='vowel-lookup',STORE='kv';
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbGet(k){const db=await idb();return new Promise((res,rej)=>{const r=db.transaction(STORE).objectStore(STORE).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbSet(k,v){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
let rows=[],matches=[],shown=0;
const $=id=>document.getElementById(id);

function parseCSV(t){const out=[];let r=[],f='',q=false;
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
  else if(c=='"')q=true;
  else if(c==','){r.push(f);f=''}
  else if(c=='\n'){r.push(f);out.push(r);r=[];f=''}
  else if(c!='\r')f+=c}
 if(f||r.length){r.push(f);out.push(r)}return out}

const norm=s=>(s||'').normalize('NFD').replace(/[\u0591-\u05C7]/g,'').replace(/\u05F0/g,'וו').replace(/\u05F1/g,'וי').replace(/\u05F2/g,'יי').replace(/[\s\-()]/g,'').toLowerCase();

function build(csv){
 const t=parseCSV(csv),head=t[0].map(h=>h.trim().toLowerCase()),idx={};
 for(const k in COLS){const [names,fb]=COLS[k];const i=head.findIndex(h=>names.includes(h));idx[k]=i>=0?i:fb}
 // Sound columns (E, F, H, I, K, L, N, O) are found by header; those letters are the fallback.
 const sNames=['short [o]','long [o]','short [e]','long [e]','short [i]','long [i]','short [u]','long [u]'],sFound=sNames.map(n=>head.indexOf(n)),sIdx=sFound.every(i=>i>=0)?sFound:[4,5,7,8,10,11,13,14];
 return t.slice(1).filter(r=>(r[idx.word]||'').trim()).map(r=>{
  const o={};for(const k in idx)o[k]=(r[idx[k]]||'').trim();
  o.sounds=[];for(const i of sIdx){const v=(r[i]||'').trim();if(v)o.sounds.push([(t[0][i]||'').trim(),v])}
  o.nw=norm(o.word);o.ng=norm(o.gloss);return o})}

function setStatus(msg){$('count').textContent=msg}

async function load(force){
 if(!force){try{const c=await idbGet(CACHE_KEY);if(c&&c.rows){rows=c.rows;setStatus(`${rows.length} entries (saved ${new Date(c.at).toLocaleDateString()})`);search()}}catch(e){}}
 try{
  setStatus(rows.length?'Updating…':'Loading data…');
  const res=await fetch(CSV_URL);if(!res.ok)throw new Error(res.status);
  const text=await res.text();
  if(text.trim().startsWith('<'))throw new Error('Sheet is not public');
  rows=build(text);
  try{await idbSet(CACHE_KEY,{at:Date.now(),rows})}catch(e){}
  setStatus(`${rows.length} entries · up to date`);search();
 }catch(e){
  setStatus(rows.length?`Offline — using saved data (${rows.length} entries)`:'Could not load the spreadsheet. Check that it is shared as “Anyone with the link can view”.');
 }}

function search(){
 const raw=$('q').value.trim(),q=norm(raw);
 if(!q){matches=[];$('results').innerHTML=rows.length?'<p class="msg">Type a Yiddish word to search. Partial matches are included.</p>':'';$('more').hidden=true;return}
 const latin=/[a-z]/i.test(raw),key=latin?'ng':'nw',m=[];
 for(const r of rows){const s=r[key];if(!s)continue;const p=s.indexOf(q);if(p<0)continue;m.push([s===q?0:p===0?1:2,s.length,r])}
 m.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
 matches=m.map(x=>x[2]);shown=0;$('results').innerHTML='';
 if(!matches.length){$('results').innerHTML='<p class="msg">No matches.</p>';$('more').hidden=true;return}
 more();
}
function more(){
 const frag=document.createDocumentFragment();
 for(const r of matches.slice(shown,shown+PAGE))frag.append(card(r));
 shown=Math.min(shown+PAGE,matches.length);$('results').append(frag);
 $('more').hidden=shown>=matches.length;
 $('more').textContent=`Show more (${matches.length-shown} left)`;
}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function card(r){
 const c=el('article','card'),w=el('h2','word',r.word);w.lang='yi';c.append(w);
 const dl=el('dl');
 const row=(label,val,node)=>{dl.append(el('dt',null,label));const d=el('dd');
  if(node)d.append(node);else if(val)d.textContent=val;else{d.className='empty';d.textContent='—'}dl.append(d)};
 row('Gloss',r.gloss);row('Component',r.comp);row('Part of speech',r.pos);
 const sn=(r.sounds||[]).length?el('div'):null;
 if(sn)for(const [h,v] of r.sounds)sn.append(el('div',null,h?`${h} - ${v}`:v));
 row('Sound',null,sn);
 row('Associated rule',r.rule);
 let fb=null;if(r.follows){const v=r.follows.toLowerCase();fb=el('span','badge '+(v.startsWith('yes')?'yes':v.startsWith('exception')?'exc':'na'),r.follows)}
 row('Follows rule?',null,fb);
 row('Notes',r.notes);
 c.append(dl);return c}


// ---- Slide 2: tables and footnotes ----
let slide=null,slideErr='';
async function loadSlide(){
 try{slide=(await idbGet('slide-v1'))||null}catch(e){}
 if(API_KEY.startsWith('PASTE')){renderSlide();return}
 if(slide)renderSlide();
 try{
  const f='slides(objectId,pageElements(transform,table,shape(placeholder,text)))';
  const r=await fetch(`https://slides.googleapis.com/v1/presentations/${SLIDES_ID}?key=${API_KEY}&fields=${encodeURIComponent(f)}`);
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();
  const sl=(j.slides||[]).find(x=>x.objectId===SLIDE_OBJ)||(j.slides||[])[1];
  if(!sl)throw new Error('slide not found');
  slide={at:Date.now(),els:sl.pageElements||[]};slideErr='';
  try{await idbSet('slide-v1',slide)}catch(e){}
 }catch(e){slideErr=String(e.message||e)}
 renderSlide();
}
function fill(node,text){
 for(const e of (text&&text.textElements)||[]){const r=e.textRun;if(!r)continue;const st=r.style||{};
  const n=document.createElement(st.baselineOffset==='SUPERSCRIPT'?'sup':st.baselineOffset==='SUBSCRIPT'?'sub':'span');
  n.textContent=r.content;if(st.bold)n.style.fontWeight='700';if(st.italic)n.style.fontStyle='italic';node.append(n)}
 if(node.lastChild)node.lastChild.textContent=node.lastChild.textContent.replace(/\n+$/,'');
 node.dir='auto'}
const plain=t=>((t&&t.textElements)||[]).map(e=>(e.textRun&&e.textRun.content)||'').join('').trim();
function tableEl(t){
 const tb=el('table');
 (t.tableRows||[]).forEach((row,ri)=>{const tr=el('tr');
  for(const c of row.tableCells||[]){if(c.rowSpan===0||c.columnSpan===0)continue;
   const cell=el(ri===0?'th':'td');if(c.columnSpan>1)cell.colSpan=c.columnSpan;if(c.rowSpan>1)cell.rowSpan=c.rowSpan;
   fill(cell,c.text);tr.append(cell)}
  tb.append(tr)});
 const w=el('div','tw');w.append(tb);return w}
function renderSlide(){
 const T=$('tables'),N=$('notes');T.innerHTML='';N.innerHTML='';
 const say=t=>{for(const P of [T,N])P.append(el('p','msg',t))};
 if(API_KEY.startsWith('PASTE'))return say('To show the slide, add your Google API key to index.html (API_KEY).');
 if(!slide)return say(slideErr?`Could not load the slide (${slideErr}).`:'Loading slide…');
 const pos=e=>[(e.transform&&e.transform.translateY)||0,(e.transform&&e.transform.translateX)||0];
 const els=[...slide.els].sort((a,b)=>pos(a)[0]-pos(b)[0]||pos(a)[1]-pos(b)[1]);
 const tables=els.filter(e=>e.table);
 const notes=els.filter(e=>e.shape&&plain(e.shape.text)&&!/TITLE|SUBTITLE|SLIDE_NUMBER/.test((e.shape.placeholder||{}).type||''));
 if(!tables.length)T.append(el('p','msg','No tables found on the slide.'));
 for(const e of tables)T.append(tableEl(e.table));
 if(!notes.length)N.append(el('p','msg','No footnotes found on the slide.'));
 for(const e of notes){const d=el('div','note');fill(d,e.shape.text);N.append(d)}
 if(slideErr){for(const P of [T,N])P.append(el('p','msg',`Showing saved copy (${slideErr}).`))}
}
function view(v){
 for(const b of document.querySelectorAll('#tabs button'))b.classList.toggle('on',b.dataset.v===v);
 $('q').hidden=v!=='search';$('results').hidden=v!=='search';
 $('more').hidden=v!=='search'||shown>=matches.length;
 $('tables').hidden=v!=='tables';$('notes').hidden=v!=='notes';
 window.scrollTo(0,0)}
document.getElementById('tabs').addEventListener('click',e=>{const v=e.target.dataset&&e.target.dataset.v;if(v)view(v)});

$('q').addEventListener('input',search);
$('more').addEventListener('click',more);
$('refresh').addEventListener('click',()=>load(true));
load(false);loadSlide();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
