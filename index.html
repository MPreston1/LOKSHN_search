<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LOKSHN Search</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LOKSHN Search">
<meta name="theme-color" content="#16324f">
<style>
:root{--bg:#eceff3;--card:#fff;--ink:#16202b;--mut:#5d6b79;--line:#d5dce4;--acc:#16324f;--ok:#1f7a4d;--okbg:#e0f2e8;--warn:#9a5200;--warnbg:#fdeccf;--na:#55606b;--nabg:#e6e9ed}
@media(prefers-color-scheme:dark){:root{--bg:#10151b;--card:#192029;--ink:#e8edf2;--mut:#93a1af;--line:#2a3541;--acc:#9cc2ee;--ok:#7fd3a3;--okbg:#17372a;--warn:#f1b266;--warnbg:#3d2a10;--na:#a3afbb;--nabg:#242d37}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:680px;margin:0 auto;padding:16px}
header{position:sticky;top:0;background:var(--bg);padding:12px 0 10px;z-index:2}
input{width:100%;font:inherit;font-size:20px;padding:14px 16px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
input:focus{outline:none;border-color:var(--acc)}
#status{display:flex;justify-content:space-between;gap:8px;color:var(--mut);font-size:13px;margin-top:8px;min-height:20px}
button{font:inherit;cursor:pointer}
#refresh{background:none;border:0;color:var(--acc);font-size:13px;padding:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 12px}
.word{font:600 34px/1.2 "Frank Ruhl Libre","David","Times New Roman",serif;direction:rtl;text-align:right;margin:0 0 8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
dl{display:grid;grid-template-columns:7.5rem 1fr;gap:6px 12px;margin:0}
dt{color:var(--mut);font-size:14px}
dd{margin:0;overflow-wrap:anywhere}
.empty{color:var(--mut)}
.badge{display:inline-block;padding:1px 10px;border-radius:99px;font-size:14px;font-weight:600}
.yes{background:var(--okbg);color:var(--ok)}.exc{background:var(--warnbg);color:var(--warn)}.na{background:var(--nabg);color:var(--na)}
.sound{color:var(--mut);font-style:italic}
#more{display:block;margin:4px auto 24px;padding:10px 20px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--acc)}
.msg{text-align:center;color:var(--mut);padding:32px 8px}
#tabs{display:flex;gap:6px;margin-top:10px}
#tabs button{flex:1;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--mut);font-weight:600}
#tabs button.on{background:var(--acc);color:var(--card);border-color:var(--acc)}
.tw{overflow-x:auto;margin:0 0 16px}
table{border-collapse:collapse;width:100%;background:var(--card)}
th,td{border:1px solid var(--line);padding:6px 6px;text-align:start;vertical-align:top;white-space:pre-line}
@media(max-width:520px){main{padding:12px 8px}table{font-size:13px}th,td{padding:4px 3px}}
th{background:var(--nabg)}
.note{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 10px}
.cap{font-weight:700;font-size:14px;letter-spacing:.02em;margin:0 0 6px}
.fn{display:flex;gap:8px;margin:0 0 10px}.fn:last-child{margin:0}
.lb{flex:none;min-width:1.6em;text-align:end;color:var(--mut)}
.tx{flex:1;min-width:0;white-space:pre-line;overflow-wrap:anywhere}
#tools{display:flex;gap:20px;justify-content:center;padding:8px 0 28px}
#tools button{background:none;border:0;color:var(--acc);font-size:13px;padding:4px}
h1{font-size:19px;line-height:1.3;margin:6px 0 0;color:var(--acc)}
button.rulelink{background:none;border:0;padding:0;font:inherit;color:var(--acc);text-decoration:underline;text-align:start;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10;padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom)}
@media(min-width:600px){.ov{align-items:center}}
.modal{position:relative;background:var(--card);color:var(--ink);border-radius:14px;max-width:640px;width:100%;max-height:85vh;overflow:auto;padding:18px 18px 20px;margin-bottom:8px}
.modal h3{margin:0 38px 12px 0;font-size:18px;line-height:1.3;overflow-wrap:anywhere}
.x{position:absolute;top:8px;right:8px;width:34px;height:34px;border:0;border-radius:50%;background:var(--nabg);color:var(--ink);font-size:22px;line-height:1;padding:0}
.rf{margin:0 0 12px}.rl{color:var(--mut);font-size:13px;margin-bottom:2px}.rt{white-space:pre-line;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h1>Searchable Companion Database for the L.O.K.SH.N Guide to Vowel Length</h1>
<header>
<input id="q" type="search" dir="auto" lang="yi" placeholder="Search a Yiddish word…" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
<div id="status"><span id="count"></span><button id="refresh" type="button">Refresh data</button></div>
<nav id="tabs"><button type="button" data-v="search" class="on">Search</button><button type="button" data-v="tables">Tables</button><button type="button" data-v="notes">Footnotes</button></nav>
</header>
<div id="results"></div>
<button id="more" type="button" hidden>Show more</button>
<div id="tables" hidden></div>
<div id="notes" hidden></div>
<footer id="tools"><button type="button" id="exp">Export data</button><button type="button" id="imp">Import data</button><input type="file" id="impfile" accept=".json,application/json" hidden></footer>
</main>
<script src="jszip.min.js"></script>
<script>
const SHEET_ID='1Vip_J4QjpMBorfov15jmbXouSXQMAmMXT0EbYsYfPkc',GID='671156978';
const CSV_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&gid=${GID}`;
const CACHE_KEY='vowel-lookup-v1',PAGE=50;
// Slide 2 tables and footnotes are read from this PowerPoint file (same folder as index.html).
const PPTX_URL='guide.pptx',SLIDE_NO=2;
// Columns are found by header name; letter positions (A,B,C,D,P,Q,R) are the fallback.
const COLS={word:[['word'],0],gloss:[['gloss'],1],comp:[['component'],2],pos:[['part of speech'],3],rule:[['associated rule'],15],follows:[['follows rule?','follows rule'],16],notes:[['notes'],17]};
const DB_NAME='vowel-lookup',STORE='kv';
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbGet(k){const db=await idb();return new Promise((res,rej)=>{const r=db.transaction(STORE).objectStore(STORE).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbSet(k,v){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
let rows=[],matches=[],shown=0,sheetAt=0;
const $=id=>document.getElementById(id);

function parseCSV(t){const out=[];let r=[],f='',q=false;
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
  else if(c=='"')q=true;
  else if(c==','){r.push(f);f=''}
  else if(c=='\n'){r.push(f);out.push(r);r=[];f=''}
  else if(c!='\r')f+=c}
 if(f||r.length){r.push(f);out.push(r)}return out}

const norm=s=>(s||'').normalize('NFD').replace(/[\u0591-\u05C7]/g,'').replace(/\u05F0/g,'וו').replace(/\u05F1/g,'וי').replace(/\u05F2/g,'יי').replace(/[\s\-()]/g,'').toLowerCase();

function build(csv){
 const t=parseCSV(csv),head=t[0].map(h=>h.trim().toLowerCase()),idx={};
 for(const k in COLS){const [names,fb]=COLS[k];const i=head.findIndex(h=>names.includes(h));idx[k]=i>=0?i:fb}
 // Sound columns (E, F, H, I, K, L, N, O) are found by header; those letters are the fallback.
 const sNames=['short [o]','long [o]','short [e]','long [e]','short [i]','long [i]','short [u]','long [u]'],sFound=sNames.map(n=>head.indexOf(n)),sIdx=sFound.every(i=>i>=0)?sFound:[4,5,7,8,10,11,13,14];
 return t.slice(1).filter(r=>(r[idx.word]||'').trim()).map(r=>{
  const o={};for(const k in idx)o[k]=(r[idx[k]]||'').trim();
  o.sounds=[];for(const i of sIdx){const v=(r[i]||'').trim();if(v)o.sounds.push([(t[0][i]||'').trim(),v])}
  o.nw=norm(o.word);o.ng=norm(o.gloss);return o})}

function setStatus(msg){$('count').textContent=msg}

async function load(force){
 if(!force){try{const c=await idbGet(CACHE_KEY);if(c&&c.rows){rows=c.rows;sheetAt=c.at;setStatus(`${rows.length} entries (saved ${new Date(c.at).toLocaleDateString()})`);search()}}catch(e){}}
 try{
  setStatus(rows.length?'Updating…':'Loading data…');
  const res=await fetch(CSV_URL);if(!res.ok)throw new Error(res.status);
  const text=await res.text();
  if(text.trim().startsWith('<'))throw new Error('Sheet is not public');
  rows=build(text);sheetAt=Date.now();
  try{await idbSet(CACHE_KEY,{at:sheetAt,rows})}catch(e){}
  setStatus(`${rows.length} entries · up to date`);search();
 }catch(e){
  setStatus(rows.length?`Offline — using saved data (${rows.length} entries)`:'Could not load the spreadsheet. Check that it is shared as “Anyone with the link can view”.');
 }}

function search(){
 const raw=$('q').value.trim(),q=norm(raw);
 if(!q){matches=[];$('results').innerHTML=rows.length?'<p class="msg">Type a Yiddish word to search. Partial matches are included.</p>':'';$('more').hidden=true;return}
 const latin=/[a-z]/i.test(raw),key=latin?'ng':'nw',m=[];
 for(const r of rows){const s=r[key];if(!s)continue;const p=s.indexOf(q);if(p<0)continue;m.push([s===q?0:p===0?1:2,s.length,r])}
 m.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
 matches=m.map(x=>x[2]);shown=0;$('results').innerHTML='';
 if(!matches.length){$('results').innerHTML='<p class="msg">No matches.</p>';$('more').hidden=true;return}
 more();
}
function more(){
 const frag=document.createDocumentFragment();
 for(const r of matches.slice(shown,shown+PAGE))frag.append(card(r));
 shown=Math.min(shown+PAGE,matches.length);$('results').append(frag);
 $('more').hidden=shown>=matches.length;
 $('more').textContent=`Show more (${matches.length-shown} left)`;
}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function card(r){
 const c=el('article','card'),w=el('h2','word',r.word);w.lang='yi';c.append(w);
 const dl=el('dl');
 const row=(label,val,node)=>{dl.append(el('dt',null,label));const d=el('dd');
  if(node)d.append(node);else if(val)d.textContent=val;else{d.className='empty';d.textContent='—'}dl.append(d)};
 row('Gloss',r.gloss);row('Component',r.comp);row('Part of speech',r.pos);
 const sn=(r.sounds||[]).length?el('div'):null;
 if(sn)for(const [h,v] of r.sounds)sn.append(el('div',null,h?`${h} - ${v}`:v));
 row('Sound',null,sn);
 const rl=r.rule?findRule(r.rule):null;
 if(rl){const rb=el('button','rulelink',r.rule);rb.type='button';rb.dir='auto';rb.onclick=()=>showRule(rl);row('Associated rule',null,rb)}
 else row('Associated rule',r.rule);
 let fb=null;if(r.follows){const v=r.follows.toLowerCase();fb=el('span','badge '+(v.startsWith('yes')?'yes':v.startsWith('exception')?'exc':'na'),r.follows)}
 row('Follows rule?',null,fb);
 row('Notes',r.notes);
 c.append(dl);return c}


// ---- Slide 2: tables and footnotes, read from the .pptx ----
const NS_A='http://schemas.openxmlformats.org/drawingml/2006/main',NS_P='http://schemas.openxmlformats.org/presentationml/2006/main',NS_R='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
let slide=null,slideErr='';
const kids=(n,ns,name)=>[...n.children].filter(c=>c.localName===name&&c.namespaceURI===ns);
const first=(n,ns,name)=>n.getElementsByTagNameNS(ns,name)[0];
function parasOf(body){
 return kids(body,NS_A,'p').map(p=>{
  const pPr=kids(p,NS_A,'pPr')[0],an=pPr&&kids(pPr,NS_A,'buAutoNum')[0],r=[];
  for(const c of p.children){if(c.namespaceURI!==NS_A)continue;
   if(c.localName==='r'){const rp=kids(c,NS_A,'rPr')[0],t=kids(c,NS_A,'t')[0];
    r.push({t:t?t.textContent:'',b:rp&&rp.getAttribute('b')==='1'?1:0,i:rp&&rp.getAttribute('i')==='1'?1:0,s:rp&&+rp.getAttribute('baseline')>0?1:0})}
   else if(c.localName==='br')r.push({t:'\n'})}
  return {l:+((pPr&&pPr.getAttribute('lvl'))||0),n:an?an.getAttribute('type'):'',st:an?+(an.getAttribute('startAt')||1):1,r}})}
const joinParas=ps=>ps.flatMap((p,i)=>i?[{t:'\n'},...p.r]:p.r);
const textOf=ps=>ps.map(p=>p.r.map(x=>x.t).join('')).join('\n').trim();
function xfrm(el){const o=first(el,NS_A,'off'),e=first(el,NS_A,'ext');return o?{x:+o.getAttribute('x'),y:+o.getAttribute('y'),w:e?+e.getAttribute('cx'):0}:{x:0,y:0,w:0}}
function parseSlideXml(xml){
 const doc=new DOMParser().parseFromString(xml,'application/xml'),tree=first(doc,NS_P,'spTree'),shapes=[],frames=[];
 for(const c of tree.children){if(c.namespaceURI!==NS_P)continue;
  if(c.localName==='sp'){const tb=kids(c,NS_P,'txBody')[0];if(!tb)continue;const ps=parasOf(tb);shapes.push({...xfrm(c),ps,text:textOf(ps)})}
  else if(c.localName==='graphicFrame'){const tbl=first(c,NS_A,'tbl');if(tbl)frames.push({...xfrm(c),tbl})}}
 const tables=frames.sort((a,b)=>Math.floor(a.y/400000)-Math.floor(b.y/400000)||a.x-b.x).map(f=>{
  const rows=kids(f.tbl,NS_A,'tr').map(tr=>kids(tr,NS_A,'tc').filter(tc=>tc.getAttribute('hMerge')!=='1'&&tc.getAttribute('vMerge')!=='1').map(tc=>{
   const tb=kids(tc,NS_A,'txBody')[0],pr=kids(tc,NS_A,'tcPr')[0];
   return {r:tb?joinParas(parasOf(tb)):[],cs:+tc.getAttribute('gridSpan')||1,rs:+tc.getAttribute('rowSpan')||1,h:pr&&kids(pr,NS_A,'solidFill').length?1:0}}));
  // caption: the closest text box just above the table, roughly in line with its left edge
  const cands=shapes.filter(s=>s.text&&Math.abs(s.x-f.x)<400000&&s.y<f.y&&f.y-s.y<700000).sort((a,b)=>(f.y-a.y)-(f.y-b.y));
  return {cap:cands[0]?joinParas(cands[0].ps):[],rows}});
 // footnotes: the text box with the most numbered paragraphs
 const count=s=>s.ps.filter(p=>p.n).length,box=[...shapes].sort((a,b)=>count(b)-count(a))[0];
 const notes=box&&count(box)?box.ps.filter(p=>p.r.map(x=>x.t).join('').trim()).map(p=>({l:p.l,n:p.n,st:p.st,r:p.r})):[];
 return {tables,notes}}
async function parsePptx(buf){
 const zip=await JSZip.loadAsync(buf),read=async f=>new DOMParser().parseFromString(await zip.file(f).async('string'),'application/xml');
 const pres=await read('ppt/presentation.xml'),rels=await read('ppt/_rels/presentation.xml.rels');
 const id=pres.getElementsByTagNameNS(NS_P,'sldId')[SLIDE_NO-1];if(!id)throw new Error('slide '+SLIDE_NO+' not found');
 const rid=id.getAttributeNS(NS_R,'id'),rel=[...rels.getElementsByTagName('Relationship')].find(r=>r.getAttribute('Id')===rid);
 const tg=rel.getAttribute('Target'),path=tg.startsWith('/')?tg.slice(1):'ppt/'+tg;
 return parseSlideXml(await zip.file(path).async('string'))}
async function loadSlide(){
 try{slide=(await idbGet('slide-v3'))||null}catch(e){}
 if(slide)renderSlide();
 try{
  if(!window.JSZip)throw new Error('unzip library missing');
  const r=await fetch(PPTX_URL,{cache:'no-cache'});if(!r.ok)throw new Error('HTTP '+r.status);
  slide=await parsePptx(await r.arrayBuffer());slide.at=Date.now();slideErr='';
  try{await idbSet('slide-v3',slide)}catch(e){}
 }catch(e){slideErr=String(e.message||e)}
 renderSlide();
}
function fill(node,runs){
 for(const x of runs||[]){const n=document.createElement(x.s?'sup':'span');n.textContent=x.t;if(x.b)n.style.fontWeight='700';if(x.i)n.style.fontStyle='italic';node.append(n)}
 if(node.lastChild)node.lastChild.textContent=node.lastChild.textContent.replace(/\n+$/,'');
 node.dir='auto'}
function tableEl(t){
 const tb=el('table');
 t.rows.forEach(row=>{const tr=el('tr');
  for(const c of row){const cell=el(c.h?'th':'td');if(c.cs>1)cell.colSpan=c.cs;if(c.rs>1)cell.rowSpan=c.rs;fill(cell,c.r);tr.append(cell)}
  tb.append(tr)});
 const box=el('div');
 if(t.cap&&t.cap.length){const cp=el('p','cap');fill(cp,t.cap);box.append(cp)}
 const w=el('div','tw');w.append(tb);box.append(w);return box}
function label(type,v){
 if(type==='alphaLcPeriod')return String.fromCharCode(96+v)+'.';
 if(type==='alphaUcPeriod')return String.fromCharCode(64+v)+'.';
 return v+'.'}
function renderSlide(){
 const T=$('tables'),N=$('notes');T.innerHTML='';N.innerHTML='';
 const say=t=>{for(const P of [T,N])P.append(el('p','msg',t))};
 if(!slide)return say(slideErr?`Could not load the slide (${slideErr}).`:'Loading slide…');
 if(!slide.tables.length)T.append(el('p','msg','No tables found on the slide.'));
 for(const t of slide.tables)T.append(tableEl(t));
 if(!slide.notes.length)N.append(el('p','msg','No footnotes found on the slide.'));
 else{const card=el('div','note'),ctr=[];
  for(const n of slide.notes){
   let lb='';if(n.n){ctr[n.l]=ctr[n.l]==null?n.st:ctr[n.l]+1;ctr.length=n.l+1;lb=label(n.n,ctr[n.l])}
   const d=el('div','fn');d.style.paddingLeft=(n.l*1.6)+'em';
   d.append(el('span','lb',lb));const tx=el('div','tx');fill(tx,n.r);d.append(tx);card.append(d)}
  N.append(card)}
 if(slideErr){for(const P of [T,N])P.append(el('p','msg',`Showing saved copy (${slideErr}).`))}
}
function view(v){
 for(const b of document.querySelectorAll('#tabs button'))b.classList.toggle('on',b.dataset.v===v);
 $('q').hidden=v!=='search';$('results').hidden=v!=='search';
 $('more').hidden=v!=='search'||shown>=matches.length;
 $('tables').hidden=v!=='tables';$('notes').hidden=v!=='notes';
 window.scrollTo(0,0)}
document.getElementById('tabs').addEventListener('click',e=>{const v=e.target.dataset&&e.target.dataset.v;if(v)view(v)});


// ---- Rules tab: popup for the associated rule ----
const RULES_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=Rules`;
let rules=[],rhead=['','',''],ruleExact=new Map(),ruleLoose=new Map();
const clean=s=>(s||'').replace(/\s+/g,' ').trim(),noSlash=s=>clean((s||'').replace(/\//g,''));
function buildRuleIdx(){ruleExact=new Map();ruleLoose=new Map();
 for(const r of rules){const a=clean(r.b),b=noSlash(r.b);if(!ruleExact.has(a))ruleExact.set(a,r);if(!ruleLoose.has(b))ruleLoose.set(b,r)}}
// Exact match first; otherwise compare with the slashes removed ("/o/ ↔ NHG /a/" finds "o ↔ NHG a").
function findRule(txt){const k=clean(txt);if(!k)return null;return ruleExact.get(k)||ruleLoose.get(noSlash(k))||null}
async function loadRules(){
 try{const c=await idbGet('rules-v1');if(c&&c.rules){rules=c.rules;rhead=c.head||rhead;buildRuleIdx()}}catch(e){}
 try{
  const res=await fetch(RULES_URL);if(!res.ok)throw new Error(res.status);
  const text=await res.text();if(text.trim().startsWith('<'))throw new Error('Sheet is not public');
  const t=parseCSV(text);rhead=[1,2,3].map(i=>((t[0]||[])[i]||'').trim());
  rules=t.slice(1).filter(r=>(r[1]||'').trim()).map(r=>({b:r[1].trim(),c:(r[2]||'').trim(),d:(r[3]||'').trim()}));
  buildRuleIdx();
  try{await idbSet('rules-v1',{at:Date.now(),head:rhead,rules})}catch(e){}
 }catch(e){}
 if($('q').value.trim())search();
}
function showRule(r){
 const ov=el('div','ov'),box=el('div','modal'),h=el('h3');h.dir='auto';h.textContent=r.b;
 const x=el('button','x','×');x.type='button';x.setAttribute('aria-label','Close');
 const esc=e=>{if(e.key==='Escape')close()},close=()=>{ov.remove();document.removeEventListener('keydown',esc)};
 x.onclick=close;ov.addEventListener('click',e=>{if(e.target===ov)close()});document.addEventListener('keydown',esc);
 box.append(x,h);
 for(const [lab,txt] of [[rhead[1],r.c],[rhead[2],r.d]]){if(!txt)continue;
  const p=el('div','rf');if(lab)p.append(el('div','rl',lab));const t=el('div','rt');t.dir='auto';t.textContent=txt;p.append(t);box.append(p)}
 ov.append(box);document.body.append(ov)}

// ---- Export / import of the saved data ----
async function exportData(){
 if(!rows.length&&!slide){alert('There is no saved data to export yet.');return}
 const data={app:'lokshn-search',version:1,exported:new Date().toISOString(),sheet:rows.length?{at:sheetAt,rows}:null,slide,rules:rules.length?{head:rhead,rules}:null};
 const name=`lokshn-search-${data.exported.slice(0,10)}.json`,file=new File([JSON.stringify(data)],name,{type:'application/json'});
 try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}}
 catch(e){if(e.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.append(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),10000)}
async function importData(file){
 try{
  const j=JSON.parse(await file.text());
  const okSheet=!!(j.sheet&&Array.isArray(j.sheet.rows)&&j.sheet.rows.every(r=>r&&typeof r.word==='string'));
  const okSlide=!!(j.slide&&Array.isArray(j.slide.tables)&&Array.isArray(j.slide.notes));
  const okRules=!!(j.rules&&Array.isArray(j.rules.rules));
  if(!okSheet&&!okSlide&&!okRules)throw new Error('this is not a LOKSHN Search export');
  const what=[okSheet?`${j.sheet.rows.length} entries`:'',okSlide?'the slide tables and footnotes':'',okRules?`${j.rules.rules.length} rules`:''].filter(Boolean).join(' and ');
  if(!confirm(`Replace the saved data with ${what} from this file?`))return;
  if(okSheet){rows=j.sheet.rows.map(r=>({...r,nw:norm(r.word),ng:norm(r.gloss||'')}));sheetAt=j.sheet.at||Date.now();
   await idbSet(CACHE_KEY,{at:sheetAt,rows});setStatus(`${rows.length} entries (imported)`);search()}
  if(okSlide){slide=j.slide;slideErr='';await idbSet('slide-v3',slide);renderSlide()}
  if(okRules){rules=j.rules.rules;rhead=j.rules.head||rhead;buildRuleIdx();await idbSet('rules-v1',{at:Date.now(),head:rhead,rules});search()}
 }catch(err){alert('Could not import: '+(err.message||err))}}
$('exp').addEventListener('click',exportData);
$('imp').addEventListener('click',()=>$('impfile').click());
$('impfile').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)importData(f)});

$('q').addEventListener('input',search);
$('more').addEventListener('click',more);
$('refresh').addEventListener('click',()=>load(true));
load(false);loadSlide();loadRules();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
