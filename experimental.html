<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Experimental rule finder</title>
<style>
:root{--bg:#eceff3;--card:#fff;--ink:#16202b;--mut:#5d6b79;--line:#d5dce4;--acc:#16324f;--ok:#1f7a4d;--okbg:#e0f2e8;--warn:#9a5200;--warnbg:#fdeccf;--na:#55606b;--nabg:#e6e9ed;--bad:#a12a2a;--badbg:#f8dcdc}
@media(prefers-color-scheme:dark){:root{--bg:#10151b;--card:#192029;--ink:#e8edf2;--mut:#93a1af;--line:#2a3541;--acc:#9cc2ee;--ok:#7fd3a3;--okbg:#17372a;--warn:#f1b266;--warnbg:#3d2a10;--na:#a3afbb;--nabg:#242d37;--bad:#f09a9a;--badbg:#3d1c1c}}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:680px;margin:0 auto;padding:16px}
h1{font-size:19px;line-height:1.3;margin:6px 0 4px;color:var(--acc)}
h2{font-size:15px;margin:18px 0 8px}
.mut{color:var(--mut);font-size:14px;margin:0 0 8px}
input#w{width:100%;font:inherit;font-size:22px;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
input#w:focus{outline:none;border-color:var(--acc)}
.opts{display:flex;flex-wrap:wrap;gap:10px 18px;margin:10px 0;align-items:center}
select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
label{display:flex;gap:6px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;direction:rtl;margin:6px 0 10px}
.chip{font:600 28px/1.2 "Frank Ruhl Libre","David","Times New Roman",serif;padding:6px 14px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--card)}
.ctx{background:var(--nabg);border-radius:8px;padding:8px 10px;font-size:14px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 10px}
.res .name{font-weight:700;font-size:17px}.res .out{font-size:24px;font-weight:700;margin:2px 0 8px;white-space:pre-line}
.lab{color:var(--mut);font-size:13px}
.btn{font:inherit;font-size:15px;font-weight:600;padding:8px 14px;border-radius:10px;border:1px solid var(--acc);background:var(--card);color:var(--acc);cursor:pointer}
.step{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;margin:0 0 8px}
.step.win{border:2px solid var(--ok)}.step.after{opacity:.6}
.pill{display:inline-block;min-width:42px;text-align:center;border-radius:99px;padding:1px 10px;font-size:13px;font-weight:700;margin-right:8px}
.p-yes{background:var(--okbg);color:var(--ok)}.p-no{background:var(--nabg);color:var(--na)}
.sn{font-weight:600;overflow-wrap:anywhere}.tag{font-size:12px;color:var(--mut);margin-left:6px}
.why{color:var(--mut);font-size:14px;margin-top:3px}
.tg{display:inline-flex;margin-right:8px;vertical-align:middle}
.tg button{padding:1px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.tg button:first-child{border-radius:99px 0 0 99px}.tg button:last-child{border-radius:0 99px 99px 0}
.tg button.on{background:var(--acc);color:var(--card);border-color:var(--acc)}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}
.msg{text-align:center;color:var(--mut);padding:24px 8px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10;padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom)}
@media(min-width:600px){.ov{align-items:center}}
.modal{position:relative;background:var(--card);color:var(--ink);border-radius:14px;max-width:640px;width:100%;max-height:85vh;overflow:auto;padding:18px 18px 20px;margin-bottom:8px}
.modal h3{margin:0 38px 12px 0;font-size:18px;line-height:1.3;overflow-wrap:anywhere}
.x{position:absolute;top:8px;right:8px;width:34px;height:34px;border:0;border-radius:50%;background:var(--nabg);color:var(--ink);font-size:22px;line-height:1;padding:0}
.rf{margin:0 0 12px}.rt{white-space:pre-line;overflow-wrap:anywhere}.rt a{color:var(--acc)}
</style>
</head>
<body>
<main>
<h1>Experimental rule finder</h1>
<p class="mut">For words that are not loshn-koydesh. The app answers every question it can from the spelling and shows each answer, so you can see where it goes wrong. Open the main app online first so the rules are saved.</p>
<input id="w" type="search" dir="auto" lang="yi" placeholder="Type a word…" autocomplete="off" autocapitalize="off" spellcheck="false">
<div class="opts">
<label>Source <select id="src"><option value="germanic">Germanic</option><option value="slavic">Slavic</option><option value="english">English</option><option value="other">Other / not sure</option></select></label>
<label><input type="checkbox" id="verb"> Verb (ignore the -ן / -ען ending)</label>
</div>
<div id="out"></div>
</main>
<script src="rulefinder.js"></script>
<script>
const $=id=>document.getElementById(id);
const norm=s=>(s||'').replace(/\s+/g,' ').replace(/\//g,'').trim().toLowerCase();
const strip=s=>(s||'').normalize('NFD').replace(/[\u0591-\u05C7\u05BE\-\s()]/g,'').replace(/\u05F0/g,'וו').replace(/\u05F1/g,'וי').replace(/\u05F2/g,'יי').toLowerCase();
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function idbGet(k){return new Promise((res,rej)=>{const r=indexedDB.open('vowel-lookup',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');
 r.onsuccess=()=>{try{const g=r.result.transaction('kv').objectStore('kv').get(k);g.onsuccess=()=>res(g.result);g.onerror=()=>rej(g.error)}catch(e){res(null)}};r.onerror=()=>rej(r.error)})}
let rules=[],rhead=['','',''],rows=[],st={stress:null,manual:{}};

// Rules in sheet order for a non-loshn-koydesh word (same order as the main app's question helper).
const isLK=r=>/^loshn-koydesh$/i.test(r.b||'');
function ruleSeq(){
 const secs=[];let cur={head:'',items:[]};secs.push(cur);
 for(const r of rules){
  if(!r.c&&!r.d){if(/^from now on/i.test(r.b))cur.items.push({note:r.b});else{cur={head:r.b,items:[]};secs.push(cur)}}
  else cur.items.push(r)}
 const intro=secs.find(x=>/^introductory$/i.test(x.head)),non=secs.find(x=>/^non-loshn-koydesh$/i.test(x.head));
 if(!intro||!non)return null;
 const main=[],late=[];
 for(const it of non.items)(it.c&&/not covered by any of the subsequent rules/i.test(it.c)?late:main).push(it);
 return [...intro.items.filter(r=>!isLK(r)&&!/^unique cases$/i.test(r.b)),...main,...late].filter(x=>!x.note)}

const PLACE_URL='https://yivo.org/yiddishland-topo';
function setText(node,text,ruleName){
 const m=/^place names$/i.test(ruleName||'')?/\bhere\b/i.exec(text):null;
 if(!m){node.textContent=text;return}
 node.textContent='';node.append(text.slice(0,m.index));
 const a=document.createElement('a');a.href=PLACE_URL;a.target='_blank';a.rel='noopener';a.textContent=m[0];
 node.append(a,text.slice(m.index+m[0].length))}
function showRule(r){
 const ov=el('div','ov'),box=el('div','modal'),h=el('h3');h.dir='auto';h.textContent=r.b;
 const x=el('button','x','×');x.type='button';x.setAttribute('aria-label','Close');
 const esc=e=>{if(e.key==='Escape')close()},close=()=>{ov.remove();document.removeEventListener('keydown',esc)};
 x.onclick=close;ov.addEventListener('click',e=>{if(e.target===ov)close()});document.addEventListener('keydown',esc);
 box.append(x,h);
 for(const [lab,txt,isOut] of [[rhead[1],r.c,false],[rhead[2],r.d,true]]){if(!txt)continue;
  const p=el('div','rf');if(lab)p.append(el('div','lab',lab));const t=el('div','rt');t.dir='auto';if(isOut)setText(t,txt,r.b);else t.textContent=txt;p.append(t);box.append(p)}
 ov.append(box);document.body.append(ov)}

const lenOf=s=>{const m=/^(short|long)/i.exec(s||'');return m?m[1].toLowerCase():''};
function render(){
 const out=$('out');out.innerHTML='';
 const say=t=>out.append(el('p','msg',t));
 const word=$('w').value.trim();
 if(!rules.length)return say('The rules are not saved yet. Open the main app online once, then come back.');
 const seq=ruleSeq();if(!seq)return say('The Rules tab does not have the expected sections.');
 if(!word)return say('Type a word to begin.');
 const verb=$('verb').checked,src=$('src').value;
 let w=word,rootNote='';
 if(verb){const r=w.replace(/ען$|ן$/,'');if(r!==w){w=r;rootNote=`Analyzing the root: ${w}`}}
 const a=RuleFinder.analyze(w);
 if(!a.nuclei.length)return say('No vowels were found in this word.');
 const guess=RuleFinder.guessStress(a),stress=st.stress!=null&&st.stress<a.nuclei.length?st.stress:guess;
 if(rootNote)out.append(el('p','mut',rootNote));
 // 1. syllables
 out.append(el('p','mut',a.nuclei.length>1?`Syllables: tap the stressed one. ${st.stress!=null&&st.stress<a.nuclei.length?'Stress set by you.':'Stress guessed by the app.'}`:'One syllable.'));
 const chips=el('div','chips');
 a.syllables.forEach((sy,i)=>{const b=el('button','chip'+(i===stress?' on':''),sy);b.type='button';b.lang='yi';b.onclick=()=>{st.stress=i;render()};chips.append(b)});
 out.append(chips);
 // 2. every determination
 const ev=RuleFinder.evaluate(a,stress,{germanic:src==='germanic',slavic:src==='slavic'}),by={};
 for(const e of ev.list)by[norm(e.name)]=e;
 const steps=seq.map(rule=>{const k=norm(rule.b),auto=by[k];
  if(k==='english')return {rule,kind:'auto',match:src==='english',why:src==='english'?'the source is English':'the source is not English'};
  if(auto)return {rule,kind:'auto',match:auto.match,why:auto.why};
  return {rule,kind:'manual',key:k,match:!!st.manual[k]}});
 const win=steps.findIndex(s=>s.match),W=win>=0?steps[win]:null;
 out.append(el('div','ctx','What the app sees: '+ev.ctx.text));
 // 3. result
 const res=el('div','card res');
 if(W){
  res.append(el('div','lab','The rule that applies is'));res.append(el('div','name',W.rule.b));
  const o=el('div','out');setText(o,W.rule.d||W.rule.c,W.rule.b);o.dir='auto';res.append(o);
  const b=el('button','btn','Show the full rule');b.type='button';b.onclick=()=>showRule(W.rule);res.append(b);
  if(/^derived$/i.test(W.rule.b))res.append(el('p','mut','Derived: next, analyze the root word instead.'));
 }else{res.append(el('div','name','No rule applies'));res.append(el('p','mut','In the Database this would be "n/a" (no rule governs the word).'))}
 out.append(res);
 // 4. comparison with the Database
 const key=strip(word),hits=rows.filter(r=>strip(r.word)===key);
 if(hits.length){
  out.append(el('h2',null,'Compare with the Database'));
  for(const r of hits){
   const c=el('div','card'),sound=r.sounds&&r.sounds[0]?r.sounds.map(x=>x[0]+' - '+x[1]).join('; '):'none recorded';
   c.append(el('div',null,`Database: rule “${r.rule||'none'}”; ${sound}; follows rule: ${r.follows||'—'}`));
   const sameRule=W?norm(W.rule.b)===norm(r.rule):norm(r.rule)==='na';
   const dbLen=lenOf(r.sounds&&r.sounds[0]&&r.sounds[0][0]),appLen=W?lenOf(W.rule.d):'';
   const l1=el('div');l1.append('Rule: ');l1.append(el('span',sameRule?'ok':'bad',sameRule?'same as the app':`different (app: ${W?W.rule.b:'no rule'})`));
   c.append(l1);
   if(appLen&&dbLen){const l2=el('div');l2.append('Vowel length: ');l2.append(el('span',appLen===dbLen?'ok':'bad',appLen===dbLen?`same (${dbLen})`:`different (app: ${appLen}, Database: ${dbLen})`));c.append(l2)}
   out.append(c)}
 }
 // 5. the walk through the rules
 out.append(el('h2',null,'Every question and the app’s answer'));
 out.append(el('p','mut','Rules are checked in the order of the Rules tab; the first Yes applies. Rules the app cannot judge from spelling are assumed No until you mark them.'));
 steps.forEach((s,i)=>{
  const row=el('div','step'+(i===win?' win':win>=0&&i>win?' after':'')),head=el('div');
  if(s.kind==='manual'){
   const tg=el('span','tg');
   for(const [label,val] of [['No',false],['Yes',true]]){const b=el('button',s.match===val?'on':'',label);b.type='button';b.onclick=()=>{st.manual[s.key]=val;render()};tg.append(b)}
   head.append(tg)}
  else head.append(el('span','pill '+(s.match?'p-yes':'p-no'),s.match?'Yes':'No'));
  head.append(el('span','sn',s.rule.b));
  head.append(el('span','tag',s.kind==='manual'?'you decide':'automatic'+(win>=0&&i>win&&s.match?' · also matches, not used':'')));
  row.append(head);
  row.append(el('div','why',s.kind==='manual'?(s.match?'You marked Yes.':'Cannot be judged from spelling; assumed No.'):s.why));
  out.append(row)});
}
$('w').addEventListener('input',()=>{st.stress=null;render()});
$('src').addEventListener('change',()=>{st.stress=null;render()});
$('verb').addEventListener('change',()=>{st.stress=null;render()});
(async()=>{
 try{const c=await idbGet('rules-v1');if(c&&c.rules){rules=c.rules;rhead=c.head||rhead}}catch(e){}
 try{const d=await idbGet('vowel-lookup-v1');if(d&&d.rows)rows=d.rows}catch(e){}
 render()})();
</script>
</body>
</html>
